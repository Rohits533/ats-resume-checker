<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATS Resume Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>ATS Resume Checker</h1>
      <p class="disclaimer">
        Educational tool. There is no universal ATS score. This simulates keyword alignment only.
      </p>
    </header>

    <section class="grid">
      <div class="panel">
        <label for="fileInput">Upload Resume (PDF or DOCX)</label>
        <input type="file" id="fileInput" accept=".pdf,.docx" />
        <textarea id="resumeText" rows="12" placeholder="Or paste your resume text here..."></textarea>
      </div>

      <div class="panel">
        <label for="jobText">Paste Job Description</label>
        <textarea id="jobText" rows="16" placeholder="Paste the job posting here..."></textarea>
      </div>
    </section>

    <button id="analyzeBtn">Analyze Match</button>

    <section id="results" class="results hidden">
      <h2>Match Score: <span id="scoreValue">0</span>%</h2>
      <div class="bar"><div id="barFill" class="fill"></div></div>

      <div class="keyword-block">
        <h3>Matched Keywords (<span id="matchedCount">0</span>)</h3>
        <p id="matchedList" class="tags"></p>
      </div>

      <div class="keyword-block">
        <h3>Missing Keywords (<span id="missingCount">0</span>)</h3>
        <p id="missingList" class="tags missing"></p>
      </div>
    </section>

    <footer>
      <p>Built as a student project. <a href="https://github.com/" target="_blank">View source on GitHub</a></p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
